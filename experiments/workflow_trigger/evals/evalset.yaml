# Labelled conversations for "chat vs. run the workflow".
#
# expect.action per user turn:
#   call     - the workflow must run, with these args (impression_goal only if given)
#   ask      - must not run; the reply must ask for exactly these missing details
#   no_call  - must not run (any reply)
# setup:
#   after_result: {slots}  - a recommendation for these slots was already shown
#   running: {slots}       - a run for these slots is in progress
# category "ambiguous" is reported separately and excluded from the headline scores.

- id: brief1_acme
  category: should_call
  turns:
    - user: "Acme Shoes is a Retail advertiser running in the US with a $30,000 budget. They care most about click-through rate and do not have a hard impression goal."
      expect: {action: call, args: {vertical: Retail, kpi: ctr, geo: US, budget: 30000}}

- id: brief2_burger
  category: should_call
  turns:
    - user: "Burger Bazaar is a QSR advertiser running in the US with a $15,000 budget. They care most about in-view rate and want at least 800,000 impressions."
      expect: {action: call, args: {vertical: QSR, kpi: in_view_rate, geo: US, budget: 15000, impression_goal: 800000}}

