- id: decline_then_go
  category: should_not_call
  turns:
    - user: "Here's a brief: Finance, US, $20k, CTR, 800k impressions minimum. Don't run it yet, I'm still confirming the budget."
      expect: {action: no_call}
    - user: "Budget confirmed. Go ahead."
      expect: {action: call, args: {vertical: Finance, kpi: ctr, geo: US, budget: 20000, impression_goal: 800000}}

