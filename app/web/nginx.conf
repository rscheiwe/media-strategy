server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /app/ {
    proxy_pass http://api:7666;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    gzip off;
  }

  location = /health {
    proxy_pass http://api:7666;
    proxy_http_version 1.1;
    proxy_buffering off;
    gzip off;
  }

  # index.html is never cached, so a redeploy shows up on the next load; the hashed assets/
  # files it points at can be cached forever (a new build gets new file names).
  location = /index.html { add_header Cache-Control "no-cache"; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
